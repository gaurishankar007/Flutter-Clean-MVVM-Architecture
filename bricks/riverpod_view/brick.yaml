name: riverpod_view
description: "A screen and its Notifier inside an existing feature (the repository must exist)."

version: 0.2.0+1

environment:
  mason: ^0.1.2

vars:
  feature:
    type: string
    description: Feature name (snake/camel/pascal all work)
    default: feature
    prompt: What is the feature name?
  notifier:
    type: string
    description: Notifier (ViewModel) name, without the Notifier suffix
    default: feature
    prompt: What is the notifier name?
  view:
    type: string
    description: Screen name, without the Screen suffix
    default: feature
    prompt: What is the screen name?
