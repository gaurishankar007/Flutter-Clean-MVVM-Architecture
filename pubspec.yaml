name: clean_architecture
description: A Flutter app template built on Clean Architecture + MVVM (Riverpod), following Flutter's official app architecture guide.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.14.0"
  flutter: ">=3.50.0"

dependencies:
  auto_route: ^11.2.0
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_hooks: ^0.21.4
  flutter_sliding_toast: ^1.8.0
  flutter_web_plugins:
    sdk: flutter
  get_it: ^9.3.0
  hooks_riverpod: ^3.5.0
  image_picker: ^1.2.4
  injectable: ^3.0.0
  intl: ^0.20.3
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  integration_test:
    sdk: flutter
  leancode_lint: ^28.0.0
  mocktail: ^1.0.5
  patrol: ^4.11.0
  patrol_finders: ^3.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800

patrol:
  app_name: cleanArchitecture
  flavor: development
  android:
    package_name: com.example.cleanArchitecture
  ios:
    bundle_id: com.example.cleanArchitecture
