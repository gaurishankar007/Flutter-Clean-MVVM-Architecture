name: clean_architecture
description: A Flutter app template built on Clean Architecture + MVVM (Riverpod), following Flutter's official app architecture guide.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.14.0"
  flutter: ">=3.50.0"

dependencies:
  auto_route: ^11.2.0
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_hooks: ^0.21.4
  flutter_sliding_toast: ^1.8.0
  flutter_web_plugins:
    sdk: flutter
  get_it: ^9.3.0
  hooks_riverpod: ^3.5.0
  image_picker: ^1.2.4
  injectable: ^3.0.0
  intl: ^0.20.3
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  integration_test:
    sdk: flutter
  leancode_lint: ^28.0.0
  mocktail: ^1.0.5
  patrol: ^4.11.0
  patrol_finders: ^3.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800

patrol:
  app_name: cleanArchitecture
  flavor: development
  android:
    package_name: com.example.cleanArchitecture
  ios:
    bundle_id: com.example.cleanArchitecture

# Run `dart run flutter_launcher_icons` after changing anything in assets/icon/.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: '#F7F7FB'
    theme_color: '#6A4CF5'

# Run `dart run flutter_native_splash:create` after changing the splash images or colours.
# Colours match the app's light/dark `background` tokens.
flutter_native_splash:
  color: '#F7F7FB'
  color_dark: '#0B0B12'
  image: assets/icon/splash.png
  android_12:
    image: assets/icon/splash_android12.png
    color: '#F7F7FB'
    color_dark: '#0B0B12'
  web: true
